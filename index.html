    <script>

        const yesButton =
            document.getElementById("yesButton");

        const noButton =
            document.getElementById("noButton");

        const loveMessage =
            document.getElementById("loveMessage");

        const subtitle =
            document.querySelector(".subtitle");


        /* =========================
           BOTÓN SÍ
        ========================== */

        yesButton.addEventListener("click", () => {

            loveMessage.classList.add("show");

            subtitle.textContent =
                "Sabía que dirias que si... 💕";

            document.body.classList.add("celebrating");

            yesButton.classList.add("selected");

            noButton.style.pointerEvents = "none";

        });


        /* =========================
           MOVER BOTÓN NO
        ========================== */

        function moveNoButton() {

            noButton.classList.add("escaping");

            requestAnimationFrame(() => {

                const buttonWidth =
                    noButton.offsetWidth;

                const buttonHeight =
                    noButton.offsetHeight;

                /*
                 * Margen de seguridad.
                 */
                const margin = 18;

                const screenWidth =
                    window.innerWidth;

                const screenHeight =
                    window.innerHeight;


                /*
                 * Límites máximos.
                 */
                const maxX =
                    Math.max(
                        margin,
                        screenWidth -
                        buttonWidth -
                        margin
                    );

                const maxY =
                    Math.max(
                        margin,
                        screenHeight -
                        buttonHeight -
                        margin
                    );


                /*
                 * Posición aleatoria.
                 */
                const x =
                    Math.random() *
                    (maxX - margin) +
                    margin;

                const y =
                    Math.random() *
                    (maxY - margin) +
                    margin;


                /*
                 * Segunda protección.
                 */
                const safeX =
                    Math.min(
                        Math.max(x, margin),
                        maxX
                    );

                const safeY =
                    Math.min(
                        Math.max(y, margin),
                        maxY
                    );


                noButton.style.transform =
                    `translate3d(
                        ${safeX}px,
                        ${safeY}px,
                        0
                    )`;

            });
        }


        /* Computadora */

        noButton.addEventListener(
            "mouseenter",
            moveNoButton
        );


        /* Celular */

        noButton.addEventListener(
            "touchstart",
            (event) => {

                event.preventDefault();

                moveNoButton();

            },
            {
                passive: false
            }
        );


        /* Clic */

        noButton.addEventListener(
            "click",
            (event) => {

                event.preventDefault();

                moveNoButton();

            }
        );


        /* =========================
           CAMBIO DE TAMAÑO
        ========================== */

        window.addEventListener(
            "resize",
            () => {

                if (
                    noButton.classList.contains(
                        "escaping"
                    )
                ) {

                    moveNoButton();

                }

            }
        );

    </script>
